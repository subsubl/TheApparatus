; PlatformIO Configuration for The Apparatus
; ESP32 Firmware for Interactive Multimedia Art Installation

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build optimization
build_type = release
build_flags = 
    -O2
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -fno-rtti
    -fno-exceptions

; Libraries
lib_deps = 
    ; Async Web Server & WebSocket (includes AsyncTCP)
    me-no-dev/ESPAsyncWebServer @ ^3.4.0
    
    ; JSON for WebSocket telemetry
    bblanchon/ArduinoJson @ ^7.0.4

; Board specific settings
board_build.flash_mode = dio
board_build.f_cpu = 240000000L

; Upload settings
upload_protocol = esptool
upload_speed = 921600

; Partition scheme for larger app + LittleFS
; Using default 4MB with 1.2MB SPIFFS/LittleFS for web assets
board_build.filesystem = littlefs
board_build.filesystem_size = 0x120000

; Monitor settings
monitor_rts = 0
monitor_dtr = 0

; ============================================================
; SIM MODE - No radar hardware required.
; Feeds a synthetic 60s scenario into the DSP pipeline:
;   0-12s   approach 420->140 cm (MACRO)
;   12-48s  stationary @ ~150 cm with 0.25 Hz breathing
;           modulation of gate energies (MICRO)
;   48-60s  retreat 140->420 cm (MACRO -> IDLE)
; Includes one injected outlier spike per cycle (EMA demo).
; Touch input remains REAL - CONTACT still testable.
; Build/flash: pio run -e esp32dev_sim -t upload
; ============================================================
[env:esp32dev_sim]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DAPPARATUS_SIM_MODE