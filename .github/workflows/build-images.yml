name: Raspberry Pi Images (The Apparatus)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'pi/**'
      - 'image/**'
      - '.github/workflows/build-images.yml'

jobs:
  build-image:
    name: ${{ matrix.flavor }} image
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        flavor: [A, B]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space (rm-based, no apt purge)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghc /opt/hostedtoolcache/CodeQL /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - name: Build ${{ matrix.flavor }} image
        uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: apparatus-pi-${{ matrix.flavor }}
          stage-list: stage0 stage1 stage2 ./image/common-stack ./${{ matrix.flavor == 'A' && 'image/flavor-a' || 'image/flavor-b' }}
          pi-gen-version: armbookworm
          release: bookworm
          hostname: apparatus-${{ matrix.flavor }}
          username: pi
          disable-first-boot-user-rename: 1
          password: apparatus
          enable-ssh: 1
          # NOTE: must be a zone present in npm `countries-and-timezones`
          # (Europe/Ljubljana is only an alias there and fails validation).
          # Same UTC offset as Ljubljana.
          timezone: Europe/Vienna
          locale: en_GB.UTF-8
          compression: xz
          compression-level: 6
          verbose-output: true

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: apparatus-pi-${{ matrix.flavor }}-img
          path: ${{ steps.build.outputs.image-path }}
          if-no-files-found: error

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.image-path }}
